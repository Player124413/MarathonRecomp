name: Build Linux

# Standalone Linux build, separate from the PR validation workflow so it can be
# started by hand and produce a downloadable binary.
#
# Настроено для сборки со вшитыми ассетами, которые уже находятся внутри репозитория.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "CMake preset to build"
        type: choice
        required: true
        default: linux-release
        options:
          - linux-release
          - linux-relwithdebinfo
          - linux-debug
      architecture:
        description: "Target architecture"
        type: choice
        required: true
        default: x86_64
        options:
          - x86_64
  push:
    branches:
      - main
      - master
      - "arena/**"
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux (${{ inputs.preset || 'linux-release' }})
    runs-on: ubuntu-24.04

    env:
      LLVM_VERSION: 18
      CMAKE_PRESET: ${{ inputs.preset || 'linux-release' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            llvm-${LLVM_VERSION}-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libx11-dev \
            libxrandr-dev \
            libwayland-dev \
            pkg-config

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-linux-${{ env.CMAKE_PRESET }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ./thirdparty/vcpkg/downloads
            ./thirdparty/vcpkg/packages
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-

      - name: Configure
        env:
          CCACHE_DIR: /tmp/ccache
        run: |
          cmake . --preset ${CMAKE_PRESET} \
            -DSDL2MIXER_VORBIS=VORBISFILE \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CCACHE_DIR: /tmp/ccache
        run: cmake --build ./out/build/${CMAKE_PRESET} --target MarathonRecomp

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: MarathonRecomp-Linux-${{ env.CMAKE_PRESET }}
          path: ./out/build/${{ env.CMAKE_PRESET }}/MarathonRecomp/MarathonRecomp
          if-no-files-found: error


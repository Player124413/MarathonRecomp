name: Build Android launcher

# Builds the Marathon Droid APK (the Android launcher in android/).
# It has no dependency on the private asset repository: the launcher never contains
# game data, it only runs the recompiled Linux binary through box64 or FEX-Emu.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: debug
        options:
          - debug
          - release
          - both
  push:
    branches:
      - main
      - master
      - "arena/**"
    paths:
      - "android/**"
      - "MarathonRecomp/hid/virtual_pad_shm.h"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android/**"
      - "MarathonRecomp/hid/virtual_pad_shm.h"

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # No submodules needed: the launcher only includes one header from the game tree.

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the debug APK
        if: ${{ inputs.build_type != 'release' }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the debug APK
        if: ${{ inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: marathondroid-debug
          path: android/app/build/outputs/apk/debug/marathondroid-debug.apk
          if-no-files-found: error

      - name: Build the release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload the release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: marathondroid-release
          path: android/app/build/outputs/apk/release/marathondroid-release.apk
          if-no-files-found: error

      - name: Report the APK size
        if: always()
        run: |
          echo "### APK artifacts" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name "*.apk" -printf "%f — %s bytes\n" >> "$GITHUB_STEP_SUMMARY" || true

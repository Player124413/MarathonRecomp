name: Build the x86_64 rootfs

# Produces the x86_64 system libraries the emulated game needs, as a single .tar.gz
# that the Android launcher downloads and unpacks by itself.
#
# Why this exists: Marathon Recompiled's Linux build is dynamically linked, so besides
# the game files it needs x86_64 glibc, libX11, glib/gio and the Vulkan loader. Android
# has none of those (its libraries are ARM64/bionic), which is why a first launch fails
# with box64 exit code 255.
#
# Assembling it here rather than on the phone is deliberate:
#   - apt resolves the full dependency tree correctly, which guessing package URLs cannot
#   - modern .deb files use xz compression, which Android has no decoder for
#   - the result is one .tar.gz: Java can gunzip it natively, so the app needs no
#     third-party archive library at all
#
# The output is attached to a GitHub release, and the launcher fetches it from there.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the rootfs under"
        type: string
        required: true
        default: rootfs-v1
  push:
    paths:
      - ".github/workflows/build-rootfs.yml"
      - "ci/workflows/build-rootfs.yml"

jobs:
  build:
    name: Assemble the rootfs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: Bootstrap a minimal Ubuntu 22.04 amd64 root
        run: |
          # --variant=minbase keeps it small: no init, no services, just the base system.
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=libx11-6,libxext6,libxrandr2,libxi6,libxcursor1,libxinerama1,libxss1,libglib2.0-0,libvulkan1,libstdc++6,libgcc-s1,zlib1g,libcurl4,libssl3,libasound2,libpulse0,libwayland-client0,libxkbcommon0,libdbus-1-3,libudev1,ca-certificates \
            jammy \
            rootfs \
            http://archive.ubuntu.com/ubuntu/

      - name: Strip everything the game will never touch
        run: |
          cd rootfs
          # Only the libraries and the dynamic loader matter; the rest is dead weight
          # on a phone.
          sudo rm -rf \
            usr/share/doc usr/share/man usr/share/locale usr/share/info \
            var/cache/apt var/lib/apt/lists var/log \
            usr/share/zoneinfo usr/share/i18n \
            boot media mnt opt srv \
            usr/games usr/local/games

          # Drop static archives and headers - useless at runtime.
          sudo find . -name '*.a' -delete
          sudo find . -name '*.o' -delete
          sudo rm -rf usr/include

          echo "Size after stripping:"
          sudo du -sh .

      - name: Sanity-check the result
        run: |
          cd rootfs

          fail=0
          for lib in \
            lib/x86_64-linux-gnu/libc.so.6 \
            lib/x86_64-linux-gnu/libm.so.6 \
            lib/x86_64-linux-gnu/libX11.so.6 \
            lib/x86_64-linux-gnu/libglib-2.0.so.0 \
            lib/x86_64-linux-gnu/libvulkan.so.1 \
            lib/x86_64-linux-gnu/libstdc++.so.6
          do
            if [ ! -e "$lib" ]; then
              echo "::error::missing $lib"
              fail=1
            else
              echo "  ok  $lib"
            fi
          done

          # The dynamic loader is what box64 hands control to.
          if [ ! -e lib64/ld-linux-x86-64.so.2 ]; then
            echo "::error::missing lib64/ld-linux-x86-64.so.2"
            fail=1
          else
            echo "  ok  lib64/ld-linux-x86-64.so.2"
          fi

          exit $fail

      - name: Pack it
        run: |
          # gzip on purpose, not xz: Java decodes gzip natively, so the launcher needs
          # no third-party decompressor.
          sudo tar czf marathon-rootfs-amd64.tar.gz -C rootfs .
          ls -lh marathon-rootfs-amd64.tar.gz
          sha256sum marathon-rootfs-amd64.tar.gz | tee marathon-rootfs-amd64.tar.gz.sha256

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marathon-rootfs-amd64
          path: |
            marathon-rootfs-amd64.tar.gz
            marathon-rootfs-amd64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish to a release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"

          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "x86_64 rootfs for Marathon Droid" \
              --notes "System libraries the Android launcher downloads automatically. Built by ci/workflows/build-rootfs.yml from Ubuntu 22.04 (jammy)."
          fi

          gh release upload "$TAG" \
            marathon-rootfs-amd64.tar.gz \
            marathon-rootfs-amd64.tar.gz.sha256 \
            --clobber

          echo "### Rootfs published" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The launcher downloads it from:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/marathon-rootfs-amd64.tar.gz" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
